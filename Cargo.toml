[workspace]
resolver = "2"
members = ["crates/*"]
# libroc's build tree (scripts/roc.sh).
exclude = [".saqa"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/tjrb-xyz/saqa"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
saqa-roc = { path = "crates/saqa-roc" }
saqa-stream = { path = "crates/saqa-stream" }
