[package]
name = "saqa-stream"
version = "0.0.0"
description = "Audio between machines over Roc: send links capture a device's channels, receive links play into an allowed input. Its REST API at /stream/v1, behind a token and Host/Origin guard."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = "0.8"
cpal.workspace = true
rtrb = "0.4.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["sync", "rt"] }
saqa-roc.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
