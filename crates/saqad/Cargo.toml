[package]
name = "saqad"
version = "0.0.0"
description = "saqa's daemon: links between machines (Roc), served at /stream/v1 on loopback behind a token and Host/Origin guard."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = "0.8"
saqa-stream.workspace = true
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
serde_json.workspace = true
ureq = { version = "3.4.2", features = ["json"] }
